<dialog id="ld"><form id="lf"><h3>Admin login</h3><input id="lp" type="password" placeholder="Password" required><button class="btn">Login</button> <button type="button" class="x" onclick="ld.close()">Cancel</button><p id="lm"></p></form></dialog><script>lg.onclick=()=>ld.showModal();lf.onsubmit=async e=>{e.preventDefault();const r=await(await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:lp.value})})).json();if(r.token){sessionStorage.t=r.token;location="/admin"}else lm.textContent=r.error}</script>
